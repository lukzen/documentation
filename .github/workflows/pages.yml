name: Deploy /public to GitHub Pages

# Source dropdown in repo Settings -> Pages must be "GitHub Actions"
# (not "Deploy from a branch"). The legacy `pages build and deployment`
# job stops auto-triggering once the dropdown is flipped.

on:
  push:
    branches: [master]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
