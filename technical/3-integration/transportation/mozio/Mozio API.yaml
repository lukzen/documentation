        * `other-cs-issue` - Other CS Issue
        * `service-quality-issue` - Service Quality Issue
        * `rebook-charge` - NPU/Rebook extra charge
        * `not-tracked` - Reservation was not tracked
        * `provider-change-pickuptime` - Provider changed pickup time but customer said otherwise
        * `provider-cancellation` - Provider asked to cancel the reservation
        * `no-pickup-turned-no-show` - No pickup turned into no-show
        * `provider-delayed-response` - Delayed Provider Response
        * `partner-compensation` - Partner Compensation
    Location For Reservations:
