              examples:
                ValidationWarningExample:
                  value:
                    pickup_datetime:
                    - code: pickup_time_too_early
                      message: Selected pickup time is too early
                      user_message: Your pickup is less than 12 hours away. Finding
                        pre-booked ride may be difficult. Consider changing time or
                        booking an on-demand ride.
                    return_pickup_datetime:
                    - code: return_time_too_early
                      message: Selected return time is too early
                      user_message: The return time you selected is within 2 hours
                        of your pickup time. Please make sure that the times are correct
                        before proceeding with your booking.
                  summary: Validation Warning Example
          description: There are warnings but provided data is valid
        '204':
          description: Provided data is valid
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidationErrorExample:
