openapi: 3.0.3
info:
  title: Mozio API
  version: v2
  contact:
    email: info@mozio.com
paths:
  /v2/amenities/:
    get:
      operationId: v2_amenities_list
      tags:
      - v2
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amenity'
          description: ''
  /v2/amenities/{amenity_id}/:
    get:
      operationId: v2_amenities_retrieve
      parameters:
      - in: path
        name: amenity_id
        schema:
          type: string
        required: true
      tags:
      - v2
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
          description: ''
  /v2/coupons/:
    post:
      operationId: v2_coupons_create
      description: |-
        Create coupon.

        You must provide a discount value either as a percentage (using `percentage_amount`) or as a fixed amount
        (using `fixed_discount_amount` and `fixed_discount_currency`).

        Percentage-based discounts will take precedence.
        ---
        responseMessages:
            - code: 201
              message: Created
            - code: 400
              message: Bad Request
            - code: 403
              message: Missing Mozio API Key
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coupon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Coupon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Coupon'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
  /v2/coupons/by_coupon_code/{coupon_code}/:
    get:
      operationId: v2_coupons_by_coupon_code_retrieve
      description: |-
        Get Coupon by code.

        Return one coupon given a coupon_code.

        ---
        parameters:
            - name: coupon_code
              required: true
              type: string
              paramType: form
      parameters:
      - in: path
        name: coupon_code
        schema:
          type: string
          pattern: ^.+$
        required: true
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
  /v2/coupons/use_it/:
    post:
      operationId: v2_coupons_use_it_create
      description: |-
        Use coupon

        Mark a coupon as used
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseCoupon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UseCoupon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UseCoupon'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCoupon'
          description: ''
  /v2/coupons/validate/:
    post:
      operationId: v2_coupons_validate_create
      description: |-
        Validate Coupon

        Check if a coupon is valid. In case it is, return the parameters of the coupon.
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCoupon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidateCoupon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidateCoupon'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCoupon'
          description: ''
  /v2/currencies/:
    get:
      operationId: v2_currencies_retrieve
      description: |-
        Get Currencies

        Return all the supported currencies.
      tags:
      - v2
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currencies'
          description: ''
  /v2/docs/schema/:
    get:
      operationId: v2_docs_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - ca
          - de
          - en
          - es
          - fr
          - id
          - it
          - ja
          - ko
          - nl
          - pl
          - pt-br
          - ru
          - th
          - vi
          - zh-hans
          - zh-hant
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /v2/engage/:
    post:
      operationId: v2_engage_create
      description: |-
        The general purpose of this endpoint is to provide Engage functionality. But right now, we will use it only for
        the "leave booking page" campaign.

        The idea of the "leave booking" flow is to store user emails on a database. If the user doesn't book on N hours,
        we send an email with a search link to resume the booking.

        The "leave booking page" campaign id is 5. The name of the provider is mandatory in this case. The url must be the
        one used on the search page (because we will redirect the user there). The backend add the name of the provider on
        a query parameter: ...&provider_name=supershuttle

        If you send more than 1 time the same email in a time range of 1 week, a 400 exception will be raised, so be
        prepared to handle it (ignoring it without blowing up the browser should be enough haha).
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Engage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Engage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Engage'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engage'
          description: ''
  /v2/flights/:
    get:
      operationId: v2_flights_retrieve
      description: |-
        Get flights

        Get flights filtered by query parameters.
        ---
        parameters:
          - name: airport_code
            description: "Airport IATA code"
            required: true
            type: string
            paramType: query
          - name: airline_code
            description: "Airline code"
            required: true
            type: string
            paramType: query
          - name: flight_direction
            description: "Possible values are 'departing' or 'arriving'"
            required: true
            type: string
            paramType: query
          - name: pickup_datetime
            description: "Pickup datetime (in iso-8601 format)"
            required: true
            type: string
            paramType: query
      tags:
      - v2
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flights'
          description: ''
  /v2/flights/airlines/:
    get:
      operationId: v2_flights_airlines_retrieve
      description: |-
        Get active airlines

        Return all the active airlines
      tags:
      - v2
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airlines'
          description: ''
  /v2/flights/verify/:
    post:
      operationId: v2_flights_verify_create
      description: |-
        Verify flight information

        Validate if the flight data is correct.

        Note that you need to provide either pickup_datetime or flight_datetime.
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidFlight'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidFlight'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidFlight'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidFlight'
          description: ''
  /v2/geolocation/:
    get:
      operationId: v2_geolocation_list
      description: |-
        Retrieve country info from the request.

        The country info is stored in the session between requests,
        so we don't have to do the lookup on each request, unless the
        client IP has changed. Taken from the django-geoip2-extras package
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Geolocation'
          description: ''
  /v2/partners/:
    get:
      operationId: v2_partners_retrieve
      description: API endpoint for partners.
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
    post:
      operationId: v2_partners_create
      description: API endpoint for partners.
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Partner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Partner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Partner'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
    patch:
      operationId: v2_partners_partial_update
      description: API endpoint for partners.
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
  /v2/partners-stats/partners/:
    get:
      operationId: v2_partners_stats_partners_retrieve
      description: API endpoint to get list of partners assigned to the current user
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /v2/partners-stats/payments/:
    get:
      operationId: v2_partners_stats_payments_list
      description: A viewset to get payments for a logged in partner
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPartnerPaymentList'
          description: ''
  /v2/partners-stats/payments/{id}/:
    get:
      operationId: v2_partners_stats_payments_retrieve
      description: A viewset to get payments for a logged in partner
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPayment'
          description: ''
  /v2/partners-stats/reservations/:
    get:
      operationId: v2_partners_stats_reservations_list
      description: A viewset to get reservations for a logged in partner
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPartnerReservationList'
          description: ''
  /v2/partners-stats/reservations/{id}/:
    get:
      operationId: v2_partners_stats_reservations_retrieve
      description: A viewset to get reservations for a logged in partner
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerReservation'
          description: ''
  /v2/partners-stats/summary/:
    get:
      operationId: v2_partners_stats_summary_retrieve
      description: API to get partner's earning statistic summary
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /v2/partners/{id}/:
    put:
      operationId: v2_partners_update
      description: |-
        Update by id

        Update partner info using its id.

        This view is overwritten so that the `partner` updated is taken from the `pk` argument and not from the request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[\d]*$
        required: true
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Partner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Partner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Partner'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
    patch:
      operationId: v2_partners_partial_update_2
      description: |-
        Update by id

        Update partner info using its id.

        This view is overwritten so that the `partner` updated is taken from the `pk` argument and not from the request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[\d]*$
        required: true
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
  /v2/partners/by-ref/{ref}/:
    get:
      operationId: v2_partners_by_ref_retrieve
      parameters:
      - in: path
        name: ref
        schema:
          type: string
          description: '''ref'' can be sent in an api call to help us determine the
            partner. It will only be taken into account if api_key is the internal
            one. E.g. for a WL we use the mozio api key and the partner''s ref'
        required: true
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
    put:
      operationId: v2_partners_by_ref_update
      parameters:
      - in: path
        name: ref
        schema:
          type: string
          description: '''ref'' can be sent in an api call to help us determine the
            partner. It will only be taken into account if api_key is the internal
            one. E.g. for a WL we use the mozio api key and the partner''s ref'
        required: true
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Partner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Partner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Partner'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
    patch:
      operationId: v2_partners_by_ref_partial_update
      parameters:
      - in: path
        name: ref
        schema:
          type: string
          description: '''ref'' can be sent in an api call to help us determine the
            partner. It will only be taken into account if api_key is the internal
            one. E.g. for a WL we use the mozio api key and the partner''s ref'
        required: true
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPartner'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
  /v2/partners/ctrip/{ctrip_id}/webhook/{webhook_type}:
    get:
      operationId: v2_partners_ctrip_webhook_retrieve
      parameters:
      - in: path
        name: ctrip_id
        schema:
          type: string
          pattern: ^.+$
        required: true
      - in: path
        name: webhook_type
        schema:
          type: string
          pattern: ^\w+$
        required: true
      tags:
      - v2
      responses:
        '200':
          description: No response body
  /v2/partners/internal/:
    get:
      operationId: v2_partners_internal_retrieve
      description: |-
        Get internal partners

        Internally used endpoint for analytics framework to retrieve a list of all partner details
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
          description: ''
  /v2/payments/confirm/{payment_id}/:
    get:
      operationId: v2_payments_confirm_retrieve
      description: Mixin to log requests
      parameters:
      - in: path
        name: payment_id
        schema:
          type: string
          pattern: ^[0-9a-f]+$
        required: true
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /v2/pickup/:
    post:
      operationId: v2_pickup_create
      description: |-
        Return a pickup time based on the inputs of the user.
        The endpoint expect a JSON object in the payload, with the parameters below as its attributes.
        ---
        request_serializer: apiv2.search.serializers.SuggestedPickupTimeSerialiazer

        type:
          suggested_time:
            required: true
            description: Suggested pickup datetime according to the provided flight information
            type: string
            format: date-time
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /v2/pricing/:
    get:
      operationId: v2_pricing_retrieve
      description: |-
        Get Pricing

        Can be used as Get or Post, sending all the params as data or queryparams.
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price for Pricing'
          description: ''
    post:
      operationId: v2_pricing_create
      description: |-
        Get Pricing

        Can be used as Get or Post, sending all the params as data or queryparams.
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Price for Pricing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Price for Pricing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Price for Pricing'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price for Pricing'
          description: ''
  /v2/pricing/exchange-rates:
    get:
      operationId: v2_pricing_exchange_rates_retrieve
      description: Get exchange rates
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price for Pricing'
          description: ''
  /v2/pricing/reservation/:
    post:
      operationId: v2_pricing_reservation_create
      description: |-
        Get reservation price breakdown

        Returns the price breakdown of an existing reservation.
      tags:
      - v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationPrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservationPrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationPrice'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPrice'
          description: ''
  /v2/recommendations/:
    get:
      operationId: v2_recommendations_retrieve
      description: Get the recommended trip for a given search.
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
          description: ''
  /v2/recommendations/many/:
    get:
      operationId: v2_recommendations_many_retrieve
      description: Get a list recommended trips for a given search.
      tags:
      - v2
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchRecommendations'
          description: ''
  /v2/reminders/:
    get:
      operationId: v2_reminders_list
      description: |-
        Get reminders

        Returns the list of reminders to setup in the mobile app.

        The response is a 'reminders' object containing a list of reminder objects.
