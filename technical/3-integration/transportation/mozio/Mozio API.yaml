          description: Customer's phone number (country code + number)
        first_name:
          type: string
          description: Customer's first name
        last_name:
          type: string
          description: Customer's last name
        airline:
          type: string
          nullable: true
          maxLength: 50
        flight_number:
          type: string
          nullable: true
          maxLength: 20
        airport_terminal:
          type: string
          nullable: true
          maxLength: 50
        airline_iata_code:
          type: string
          writeOnly: true
          default: ''
          description: Airline IATA code
        special_instructions:
          type: string
        old_reservation_id:
          type: string
          writeOnly: true
        search_id:
          type: string
          writeOnly: true
          description: Search ID
        result_id:
          type: string
          writeOnly: true
          description: Selected result ID
        country_code_name:
          type: string
          writeOnly: true
          default: ''
          description: Country code in ISO Alpha-2 code
        optional_amenities:
          type: array
          items:
            type: string
            default: ''
          writeOnly: true
          default: []
          description: Optional amenities selected, like wifi or wheelchair
        cruise_line:
          type: string
          nullable: true
          maxLength: 50
        ship_name:
          type: string
          nullable: true
          maxLength: 30
        flight_type:
          description: |-
            If the voyage is for a domestic or international flight

            * `international` - International
            * `domestic` - Domestic
          oneOf:
          - $ref: '#/components/schemas/FlightTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        extra_pax_info:
          type: array
          items:
