        * `force-majeure` - Force Majeure
        * `no-proof-provided` - No proof provided
        * `extra-charge-requested-by-provider` - Extra charge requested by the provider
        * `vehicle-category` - Vehicle Category
        * `provider-cancellation` - Provider Cancellation
        * `customer-did-not-follow-pui` - Customer did not follow PUI
        * `mozio-exception` - Mozio Exception
        * `customer-wrong-car` - Customer booked the wrong type of car
        * `pickup-time` - Pickup Time
        * `no-support-finding-vehicle` - No Support finding the driver
        * `meet-and-greet-not-provided` - Meet and Greet not provided
