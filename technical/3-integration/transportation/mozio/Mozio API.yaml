      - in: query
        name: email_address
        schema:
          type: string
          format: email
          minLength: 1
        description: Customer email
      - in: query
        name: last_name
        schema:
          type: string
          minLength: 1
        description: Customer last name
      - in: query
        name: pickup_datetime
        schema:
          type: string
          format: date-time
      - in: path
        name: user_reservation_id
        schema:
          type: string
          pattern: ^.+$
        required: true
      - in: query
        name: user_reservation_id
        schema:
          type: string
          minLength: 1
        description: User reservation id
        required: true
