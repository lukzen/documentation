      - status
    ReservationIssue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue_type:
          $ref: '#/components/schemas/IssueTypeEnum'
        zendesk_ticket:
          type: string
          nullable: true
          maxLength: 100
        timestamp:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
          description: Extra comments
        predefined_reason:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PredefinedReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        flight_track:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/FlightTrackEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        partner_action:
          nullable: true
          title: Partner amount type
          description: |-
            This field is used exclusively by the finance team.

            * `charge` - Charge Partner
            * `refund` - Refund Partner
            * `not-applicable` - Not applicable to the partner
          oneOf:
          - $ref: '#/components/schemas/PartnerActionEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        provider_action:
          nullable: true
          title: Provider amount type
          oneOf:
          - $ref: '#/components/schemas/ProviderActionEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        penalty_amount_currency:
          type: string
          readOnly: true
          nullable: true
        penalty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
          title: Penalty amount provider
          description: Amount to charge/refund the provider for this issue. Does not
            need to be filled in case of an NPU or No Show.
        penalty_amount_partner_currency:
          type: string
          readOnly: true
          nullable: true
        penalty_amount_partner:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
          description: Amount to charge/refund the partner for this issue. This field
            is used exclusively by the finance team.
        penalize_provider:
          type: boolean
          description: If checked, this issue will be counted in the provider's NPU
            rate.
        is_resolved:
          type: boolean
          description: Check if this issue has been resolved. If checked, emails will
            NOT be sent to the provider and supply teams informing them of the issue.
        resolved_reason:
          type: string
          nullable: true
          description: How was it resolved?
        resolved_timestamp:
          type: string
          format: date-time
          nullable: true
        reservation:
          type: integer
        agent:
          type: integer
          nullable: true
          description: Agent that reported this issue
        resolved_agent:
          type: integer
          nullable: true
          description: Agent that resolved this issue
        reported_on:
          type: integer
          nullable: true
      required:
      - id
      - issue_type
      - penalty_amount_currency
      - penalty_amount_partner_currency
      - reservation
