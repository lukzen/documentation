        * `traffic-blocked` - Traffic blocked due to a certain events
        * `driver-attitude` - Driver Attitude
        * `mozio-fault` - Mozio's Fault
        * `pickup-time-not-respected` - Pickup Time not respected
        * `provider-exception` - Provider-exception
        * `vehicle-conditions` - Vehicle Conditions
        * `price-differences` - Price differences
        * `driving-and-safety` - Driving and Safety
