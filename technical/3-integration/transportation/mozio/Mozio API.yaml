        save_card:
          type: boolean
          writeOnly: true
          default: false
          description: Whether card information should be saved or not
        use_reservation_card:
          type: boolean
          default: false
          description: Users can use the existing reservation payment method if the
            reservation price increased. This is also used by default if there was
            no change in the price.
        card_description:
          type: string
          writeOnly: true
          description: Card description
        card_token_id:
          type: string
          writeOnly: true
          description: Stripe card_token_id, required if stored_card_id is not sent
        card_source_id:
          type: string
          writeOnly: true
          description: Stripe Source id, optional
        paymentintent_id:
          type: string
          writeOnly: true
          description: Stripe PaymentIntent id, optional
        stripe_origin:
          allOf:
          - $ref: '#/components/schemas/StripeOriginEnum'
          writeOnly: true
          default: USD
          description: |-
            The stripe account where to create the new card, defaults to USD

            * `USD` - USD
        stored_card_id:
          type: string
          writeOnly: true
          description: Card id stored in mozio-auth. required if card_token_id is
            not sent
        charge_provider:
          type: boolean
          writeOnly: true
          default: false
          description: Staff users can select whether the customer should be charged
            or if the provider should be charged the additional fees.
        selected_ticket_id:
          type: string
          writeOnly: true
          default: ''
          description: Selected ticket type
        alternative_time_index:
          type: integer
          writeOnly: true
          default: -1
          description: Selected item from alternative_times
      required:
      - old_reservation_id
      - search_id
    ReservationChangeSearch:
      type: object
      properties:
        currency:
          type: string
          writeOnly: true
          default: USD
          description: Currency to display the results
          maxLength: 5
        start_address:
          type: string
          writeOnly: true
          description: Exact formatted address where the customer should be picked
            up (e.g. 37 NE Velmont St, Portland, Oregon)
          maxLength: 200
        end_address:
          type: string
          writeOnly: true
          description: Exact formatted address where the customer should be dropped
            off (e.g. 37 NE Velmont St, Portland, Oregon)
          maxLength: 200
        start_id:
          type: string
          writeOnly: true
          description: Google maps or Baidu maps place_id for the start location
        end_id:
          type: string
          writeOnly: true
          description: Google maps or Baidu maps place_id for the end location
        start_name:
          type: string
          writeOnly: true
          description: Custom name for the start location
          maxLength: 200
        end_name:
          type: string
          writeOnly: true
          description: Custom name for the end location
          maxLength: 200
        start_lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude value for the start location
        start_lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude value for the start location
        end_lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude value for the end location
        end_lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude value for the end location
        start_terminal:
          type: string
          writeOnly: true
          description: Terminal to be picked up
          maxLength: 200
        end_terminal:
          type: string
          writeOnly: true
          description: Terminal to be dropped off
          maxLength: 200
        start_is_hotel:
          type: boolean
          writeOnly: true
          default: false
          description: The start location will be considered a hotel.
        end_is_hotel:
          type: boolean
          writeOnly: true
          default: false
          description: The end location will be considered a hotel.
        start_favorite_id:
          type: integer
          writeOnly: true
          description: User favorite place id.
        start_favorite_source:
          type: string
          writeOnly: true
          description: User favorite source code.
        end_favorite_id:
          type: integer
          writeOnly: true
          description: User favorite place id.
        end_favorite_source:
          type: string
          writeOnly: true
          description: User favorite source code.
        num_passengers:
          type: integer
          minimum: 1
          default: 1
          description: Filter search results according to vehicle capacity
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
          writeOnly: true
          description: Different passenger ticket categories and how many to buy
        pass_types:
          type: array
          items:
            $ref: '#/components/schemas/PassType'
          writeOnly: true
          description: Different passenger passes and how many to buy
        pickup_datetime:
          type: string
          format: date-time
          description: Datetime when the customer has to be picked up (in iso-8601
            format). If no pickup_datetime and no flight_datetime is provided, we
            will search for 5 minutes from now.
        flight_datetime:
          type: string
          format: date-time
          description: Datetime of the flight (in iso-8601 format)
        start_partner_location_id:
          type: string
          description: Unique identifier for the start location. It can be an internal
            code, the location coordinates, a geohash or any other element that can
            uniquely identify this location. It will be returned in the response.
          maxLength: 200
        end_partner_location_id:
          type: string
          description: Unique identifier for the end location. It can be an internal
            code, the location coordinates, a geohash or any other element that can
            uniquely identify this location. It will be returned in the response.
          maxLength: 200
        partner_market_id:
          type: string
          description: Unique identifier for the package destination. It's the element
            that will be used to group all locations in the same destination, e.g.
            When requesting rates for packages in Cancún, the `market_id` could be
            'CUN', 'CANCUN', 'MXCUN123' or other identifier you have to associate
            different locations (Iberostar Grand Hotel, Grand Paladium) with the package
            destination (Cancún)
          maxLength: 64
        package_result_id:
          type: string
          description: Id of the package result, used to refresh the search for booking
        include_platform_fee:
          type: boolean
          default: false
          description: If true, a $2 platform fee will be included in the total price.
        include_target_pricing:
          type: boolean
          default: true
          description: If true, a target pricing will affect the prices.
        go_corp_id:
          type: string
          description: Identifier for go transit corporation id.
          maxLength: 200
        search_id:
          type: string
          description: Id of the search. Should be use when polling results or making
            a reservation
          maxLength: 100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
          readOnly: true
          description: A list with possible voyages. If more_coming is `true` it means
            that more voyages could be retrieved next time this endpoint is called
        currency_info:
          allOf:
          - $ref: '#/components/schemas/Currency for Search'
          readOnly: true
        start_location:
          allOf:
          - $ref: '#/components/schemas/Location For Search'
          readOnly: true
          description: Start location of the trip
        end_location:
          allOf:
          - $ref: '#/components/schemas/Location For Search'
          readOnly: true
          description: End location of the trip
        created_at:
          type: integer
          readOnly: true
          description: Timestamp when the search was created
        expires_at:
          type: integer
          readOnly: true
          description: Timestamp when the search expires
        expires_in:
          type: integer
          readOnly: true
          description: Amount of seconds from `now` when the trip become expired
        more_coming:
          type: boolean
          readOnly: true
          description: If 'True' it means that {search_id}/poll/ should be called
            to get more results
        allow_delayed_flight_info:
          type: boolean
          readOnly: true
          description: Whether or not the partner do not require flight info at booking
            time and will ask customer to complete it later
        hourly_booking_duration:
          type: integer
          default: 0
          description: Hourly trips duration
        reservation:
          type: string
          readOnly: true
        current_api_provider:
          type: boolean
          writeOnly: true
          default: true
        reservation_hashed_id:
          type: string
          writeOnly: true
      required:
      - allow_delayed_flight_info
      - created_at
      - currency_info
      - end_location
      - expires_at
      - expires_in
      - more_coming
      - reservation
      - reservation_hashed_id
      - results
      - start_location
    ReservationCreateSerializerOutput:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
          description: list of reservation if status of process is complete
