    Voyage:
      type: object
      properties:
        flight_datetime:
          type: string
          description: Flight datetime, localized (in iso-8601 format)
        departure_datetime:
          type: string
          description: Voyage departure datetime, localized (in iso-8601 format)
        arrival_datetime:
          type: string
          description: Voyage arrival datetime, localized (in iso-8601 format)
        alternative_times:
          type: object
          additionalProperties: {}
          description: All possible local departure datetimes
        alternative_time_index:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Selected local departure datetime
        num_passengers:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Number of passengers
        service_type:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: TO_AIRPORT -> 1, FROM_AIRPORT -> 2, POINT_TO_POINT -> 3, AIRPORT_TRANSFER
            -> 4, HOURLY_BOOKING -> 5, HOURLY_BOOKING_FROM_AIRPORT -> 6, PASSES ->
            7
        meet_and_greet_chosen:
          type: boolean
          description: Whether or not meet and greet was chosen
        currency:
          type: string
          description: Currency of the voyage
          maxLength: 3
        booking_details:
          type: object
          additionalProperties: {}
          description: Dictionary with booking information like 'bookable', 'amendable',
            'cancellable_offline', 'cancellable_online', 'cancellation_policy', 'gratuity_included',
            'accepts_gratuity', 'meet_and_greet_available', 'meet_and_greet_default',
            'meet_and_greet_price''extra_pax_required'
        start_location:
          type: object
          additionalProperties: {}
          description: Dictionary representing the start location object
        end_location:
          type: object
          additionalProperties: {}
          description: Dictionary representing the end location object
        vehicle:
          type: object
          additionalProperties: {}
          description: Voyage vehicle details
        provider_currency:
          type: string
          nullable: true
          description: Currecy used by the provider
          maxLength: 3
        provider_phone:
          type: string
          description: Provider's phone
        provider_email:
          type: string
          description: Provider's email
        provider_name:
          type: string
          description: The provider's name
        start_difference:
          type: number
          format: double
          description: Difference between start and pickup locations
        end_difference:
          type: number
          format: double
          description: Difference between end and drop off locations
        steps:
          type: object
          additionalProperties: {}
          description: steps for this reservation
        ticket_data:
          type: object
          additionalProperties:
            type: string
          readOnly: true
          default: {}
          description: Dictionary with ticket information
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
          readOnly: true
          description: Tickets information
        pass_types:
          type: array
          items:
            $ref: '#/components/schemas/PassType'
          readOnly: true
          default: []
          description: Passes information
        amenities:
          type: object
          additionalProperties: {}
          description: List of amenities.
        hourly_details:
          allOf:
          - $ref: '#/components/schemas/HourlyDetails'
          readOnly: true
          description: Details of the booked hourly trip
        flt_support:
          type: boolean
          description: Reservation was made through FLT flow
      required:
      - alternative_time_index
      - arrival_datetime
      - departure_datetime
      - end_difference
      - flight_datetime
      - hourly_details
      - num_passengers
      - pass_types
      - provider_name
      - service_type
      - start_difference
      - ticket_data
      - ticket_types
      - vehicle
    VoyageSpecificAmenity:
      type: object
      properties:
        key:
          type: string
          description: Amenity key. E.g. ride_tracking, meet_and_greet, bullet_proof
        name:
          type: string
          description: Amenity name. E.g. 'Wheelchair accessible', 'Meet & Greet',
            'Bulletproof cars'
        description:
          type: string
          description: Amenity description
        image_url:
          type: string
          format: uri
          description: Amenity image url
        png_image_url:
          type: string
          format: uri
          description: Amenity image url in png format
        input_type:
          type: string
          description: Amenity input type to help Frontend render appropriate input
            field. E.g. 'numeric', 'boolean', 'file', etc.
        included:
          type: boolean
          description: Whether the amenity is included or not in the voyage
        selected:
          type: boolean
          description: Whether an optional amenity is chosen or not in the voyage
        price:
          allOf:
          - $ref: '#/components/schemas/DisplayableMoney'
          description: Amenity price
      required:
      - image_url
      - included
      - key
      - name
      - price
      - selected
    WaitTime:
      type: object
      properties:
        minutes_included:
          type: integer
          description: How many wait minutes are included
        waiting_minute_price:
          allOf:
          - $ref: '#/components/schemas/DisplayableMoney'
          description: Fee per minute after the included waiting time.
      required:
      - minutes_included
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
