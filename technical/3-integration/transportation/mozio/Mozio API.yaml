components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          nullable: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
    Airline:
      type: object
      properties:
        airline_code:
          type: string
          description: Airline code (e.g. 'AA')
        airline_name:
          type: string
          description: Airline name (e.g. 'American Airlines')
      required:
      - airline_code
      - airline_name
    Airlines:
      type: object
      properties:
        airlines:
          type: array
          items:
            $ref: '#/components/schemas/Airline'
      required:
      - airlines
    AlternativeDateTime:
      type: object
      properties:
        departure_datetime:
          type: string
          format: date-time
          description: Departure datetime (in iso-8601 format)
        arrival_datetime:
          type: string
          format: date-time
          description: Arrival datetime (in iso-8601 format)
      required:
      - arrival_datetime
      - departure_datetime
    AlternativeDateTimes:
      type: object
      properties:
        default_index:
          type: integer
          description: The index in the options list for the default pickup time for
            this step.
        options:
          type: array
          items:
            $ref: '#/components/schemas/AlternativeDateTime'
          readOnly: true
          description: List of possible departure/arrival options for this step
      required:
      - default_index
      - options
    Amenity:
      type: object
      properties:
        key:
          type: string
          description: Amenity key. E.g. ride_tracking, meet_and_greet, bullet_proof
        name:
          type: string
          description: Amenity name. E.g. 'Wheelchair accessible', 'Meet & Greet',
            'Bulletproof cars'
        description:
          type: string
          description: Amenity description
        image_url:
          type: string
          format: uri
          description: Amenity image url
        png_image_url:
          type: string
          format: uri
          description: Amenity image url in png format
        input_type:
          type: string
          description: Amenity input type to help Frontend render appropriate input
            field. E.g. 'numeric', 'boolean', 'file', etc.
      required:
      - image_url
      - key
      - name
    BlankEnum:
      enum:
      - ''
    CampaignEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `1` - Exit Intent
        * `2` - No Search Result
        * `3` - Partner Coupon Request
        * `4` - Search Alert
        * `5` - Leave Booking Page
        * `6` - Partnering
    CarCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CcTypeEnum:
      enum:
      - Visa
      - MasterCard
      - American Express
      - Diners Club
      - JCB
      - Discover
      - UnionPay
      type: string
      description: |-
        * `Visa` - Visa
        * `MasterCard` - MasterCard
        * `American Express` - American Express
        * `Diners Club` - Diners Club
        * `JCB` - JCB
        * `Discover` - Discover
        * `UnionPay` - UnionPay
    Coupon:
      type: object
      description: Serializer to create coupons.
      properties:
        expiration_date:
          type: string
          format: date-time
          description: Expiration date of the coupon (in ISO-8601 format)
        coupon_code:
          type: string
          description: If none, a random one is generated
          maxLength: 80
        percentage_amount:
          type: integer
          maximum: 100
          minimum: 0
          description: Percentage of discount
        fixed_discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Fixed amount of discount
        fixed_discount_currency:
          type: string
          description: Currency code of the fixed amount of discount (in ISO-4217
            format)
        uses_limit:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Number of times the coupon can be used
        user_email:
          type: string
          format: email
          description: Email address of the user to limit the coupon to
        provider_name:
          type: string
          nullable: true
          description: Name of the provider to limit the coupon to
          maxLength: 191
        vehicle:
          nullable: true
          description: |-
            Type of vehicle to limit the coupon to

            * `1` - Shared Ride Van
            * `2` - Private Van
            * `3` - Sedan
            * `4` - SUV
            * `5` - Limo
            * `6` - Private Bus
            * `7` - Airporter
            * `8` - Local Driver
            * `9` - Taxi
            * `10` - Express Train
            * `11` - Minicab
            * `13` - MotoTaxi
            * `15` - Shared Taxi
            * `16` - Water Taxi
            * `17` - Shared Water Taxi
            * `18` - Water Shuttle
            * `19` - Shared Water Shuttle
            * `20` - Helicopter
            * `21` - Bus
            * `22` - Train
            * `102` - All Inclusive Van
            * `103` - All Inclusive Sedan
            * `104` - All Inclusive SUV
            * `105` - All Inclusive Limo
            * `106` - All Inclusive Bus
            * `107` - All Inclusive Taxi
            * `108` - All Inclusive Shared Van
            * `109` - All Inclusive Water Taxi
            * `110` - All Inclusive Local Driver
            * `88888` - Public transit
            * `99999` - Walk
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/VehicleEnum'
          - $ref: '#/components/schemas/NullEnum'
        min_time:
          type: string
          format: date-time
          nullable: true
          description: Start of the time window to limit the coupon to
        max_time:
          type: string
          format: date-time
          nullable: true
          description: End of the time window to limit the coupon to
        description:
          type: string
          nullable: true
          maxLength: 200
        point_nw_lat:
          type: number
          format: double
          nullable: true
          title: NW latitute
          description: NW latitude of the bounding box to limit the coupon to
        point_nw_lng:
          type: number
          format: double
          nullable: true
          title: NW longitude
          description: NW longitude of the bounding box to limit the coupon to
        point_se_lat:
          type: number
          format: double
          nullable: true
          title: SE latitute
          description: SE latitude of the bounding box to limit the coupon to
        point_se_lng:
          type: number
          format: double
          nullable: true
          title: SE longitude
          description: SE longitude of the bounding box to limit the coupon to
        minimum_spend_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Minimum spend amount to use coupon
        minimum_spend_amount_currency:
          type: string
          description: Currency code of the minimum spend amount (in ISO-4217 format)
        required_ticket_pass_code:
          type: object
          additionalProperties: {}
          description: List containing the ticket/pass codes
      required:
      - expiration_date
    CreditCard:
      type: object
      properties:
        last4:
          type: string
          description: Last 4 digits of the credit card used to pay for this reservation
        brand:
          type: string
          description: The brand of credit card used to pay for this reservation
      required:
      - brand
      - last4
    Currencies:
      type: object
      properties:
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/Currency for Currencies'
      required:
      - currencies
    Currency for Currencies:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        support_level:
          type: integer
        symbol:
          type: string
      required:
      - code
      - name
      - support_level
      - symbol
    Currency for Search:
      type: object
      properties:
        code:
          type: string
          description: Currency code. E.g. USD
          maxLength: 3
          minLength: 3
        prefix_symbol:
          type: string
          description: Currency preffix symbol. E.g $
        suffix_symbol:
          type: string
          description: Currency suffix symbol
      required:
      - code
      - prefix_symbol
      - suffix_symbol
    DisplayableMoney:
      type: object
      properties:
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Money value like '15.00'
        display:
          type: string
          description: Money value for displaying like '$15.00'
        compact:
          type: string
          description: Money value without decimals for displaying like '$15'
      required:
      - compact
      - display
      - value
    DisplayableMoneyDetailed:
      type: object
      properties:
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Money value like '15.00'
        display:
          type: string
          description: Money value for displaying like '$15.00'
        compact:
          type: string
          description: Money value without decimals for displaying like '$15'
        currency:
          type: string
          default: USD
          description: currency used
          maxLength: 5
        smallest_currency_unit:
          type: integer
          readOnly: true
          description: value as smallest currency unit
      required:
      - compact
      - display
      - smallest_currency_unit
      - value
    Driver:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        external_id:
          type: string
          nullable: true
          description: Unique code that identifies the driver in the external provider
          maxLength: 50
        name:
          type: string
          nullable: true
          description: Name of driver
          maxLength: 100
        phone:
          type: string
          nullable: true
          description: Phone number of driver
          maxLength: 50
        license_number:
          type: string
          nullable: true
          description: Driver license
          maxLength: 50
        image_url:
          type: string
          format: uri
          nullable: true
          description: URL for driver photo
          maxLength: 500
      required:
      - id
    DriverVehicle:
      type: object
      properties:
        status:
          type: string
          readOnly: true
          description: Status of the reservation
        driver:
          $ref: '#/components/schemas/Driver'
        vehicle:
          $ref: '#/components/schemas/Vehicle for Reservations'
      required:
      - status
    DriverVehicleInfo:
      type: object
      description: Serializer for Driver and Vehicle Info
      properties:
        external_id:
          type: string
          description: Provider External ID
          maxLength: 64
        provider_type:
          type: string
          description: Provider Type
          maxLength: 64
        driver:
          $ref: '#/components/schemas/Driver'
        vehicle:
          $ref: '#/components/schemas/Vehicle for Reservations'
      required:
      - driver
      - external_id
      - provider_type
      - vehicle
    Duration:
      type: object
      properties:
        value:
          type: integer
          description: Time in Seconds
      required:
      - value
    Engage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provider_name:
          type: string
          writeOnly: true
          maxLength: 191
        extra_data:
          type: object
          additionalProperties: {}
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 70
        company_name:
          type: string
          maxLength: 70
        campaign:
          allOf:
          - $ref: '#/components/schemas/CampaignEnum'
          minimum: -2147483648
          maximum: 2147483647
        url:
          type: string
          format: uri
          maxLength: 500
        page_type:
          type: string
          maxLength: 50
        session_id:
          type: string
          maxLength: 200
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        timestamp:
          type: string
          format: date-time
          readOnly: true
        partner:
          type: integer
          nullable: true
      required:
      - campaign
      - email
      - id
      - timestamp
      - url
    ExtraPassengerInfo:
      type: object
      properties:
        first_name:
          type: string
          description: Passenger first name
          maxLength: 50
        last_name:
          type: string
          description: Passeger last name
          maxLength: 50
        email:
          type: string
          format: email
          nullable: true
          description: Passeger email
          maxLength: 254
      required:
      - first_name
      - last_name
    Flight:
      type: object
